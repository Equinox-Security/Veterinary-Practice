<title>Pet Portal — Sign In</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4f6f5;margin:0;}#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}.login-card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.08);padding:2.5rem;width:100%;max-width:360px;text-align:center;}.login-card h2{margin-bottom:0.4rem;}.login-card input{width:100%;padding:0.7rem 1rem;border:1.5px solid #dce2e8;border-radius:7px;font-size:0.95rem;margin-bottom:0.85rem;box-sizing:border-box;}#portal-login-error{font-size:0.8rem;color:#c0392b;margin-bottom:0.75rem;display:none;}.login-btn{width:100%;background:#2c5f4f;color:#fff;padding:0.75rem 1rem;border-radius:7px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;}#portal-mount{max-width:640px;margin:0 auto;padding:2rem;display:none;}</style>

tal-mount").innerHTML=renderPortalData(data);document.getElementById("login-screen").style.display="none";document.getElementById("portal-mount").style.display="block";}catch(e){errEl.style.display="block";document.getElementById("portal-password").value="";}}</script>
